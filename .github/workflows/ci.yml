# dsh-whale-pet CI（M6-1）：node --test 单测 + test:compat 宿主探活双平台门禁。
# compat 双车道自装宿主（0.1.7-rc.2 + 0.2.0-rc.2，npm 隔离安装，不动全局）；改车道须同步 scripts/compat.mjs 与开发计划 §1。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit (node --test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  compat:
    name: compat (isolated profile probe)
    # 仅 windows：compat 探活依赖 dsh profile init/add 的交互面，ubuntu runner 上
    # dsh 子进程持有 stdio 管道导致脚本在内部超时后仍无法退出（2026-10-01 实测挂起 13min+）；
    # 进程树击杀/泄漏自检本就是 win32 分支，windows 覆盖即可。ubuntu 由 unit job 把守。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # dsh 由 scripts/compat.mjs 按车道隔离安装进临时目录；pnpm 必须在 PATH（dsh plugin add 转发）。
      - name: Install pnpm
        run: npm i -g pnpm
      - name: Run compat gate (both lanes)
        run: npm run test:compat
