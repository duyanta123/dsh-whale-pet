# dsh-whale-pet CI（M6-1）：node --test 单测 + test:compat 宿主探活双平台门禁。
# 基线锁定 @deepseek-ai/dsh@0.1.7-rc.2（改基线须同步 scripts/compat.mjs 与开发计划 §1）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit (node --test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  compat:
    name: compat (isolated profile probe)
    # 仅 windows：compat 探活依赖 dsh profile init/add 的交互面，ubuntu runner 上
    # dsh 子进程持有 stdio 管道导致脚本在内部超时后仍无法退出（2026-10-01 实测挂起 13min+）；
    # 进程树击杀/泄漏自检本就是 win32 分支，windows 覆盖即可。ubuntu 由 unit job 把守。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install host baseline
        run: |
          npm i -g pnpm
          npm i -g @deepseek-ai/dsh@0.1.7-rc.2
      - name: Run compat gate
        run: npm run test:compat
